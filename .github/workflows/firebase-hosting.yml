name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - 'firestore.rules'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Secrets required:
    #   FIREBASE_SERVICE_ACCOUNT — JSON of a Firebase service account
    #     (or run `firebase login:ci` and store the token as FIREBASE_TOKEN)
    if: ${{ secrets.FIREBASE_TOKEN != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env from example (fill via repo secrets if needed)
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v13
        with:
          args: deploy --only hosting,firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
